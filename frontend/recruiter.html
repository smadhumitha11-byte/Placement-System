<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recruiter Dashboard - Placement Cell Portal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav id="navbar"></nav>

    <main class="container">
        <h2 class="section-title" style="margin-top:0;">Recruiter Dashboard</h2>
        <div id="pageMessage" class="alert"></div>

        <!-- ===== Company profile ===== -->
        <h2 class="section-title">Company Profile</h2>
        <div class="card">
            <form id="profileForm" novalidate>
                <div class="form-row">
                    <div class="form-group">
                        <label for="c-company_name">Company Name</label>
                        <input type="text" id="c-company_name">
                        <div class="field-error" id="c-company_name-error"></div>
                    </div>
                    <div class="form-group">
                        <label for="c-email">Login Email (cannot be changed)</label>
                        <input type="text" id="c-email" disabled>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="c-phone">Phone (10 digits)</label>
                        <input type="text" id="c-phone" maxlength="10">
                        <div class="field-error" id="c-phone-error"></div>
                    </div>
                    <div class="form-group">
                        <label for="c-website">Website</label>
                        <input type="text" id="c-website" placeholder="https://example.com">
                        <div class="field-error" id="c-website-error"></div>
                    </div>
                </div>
                <div class="form-group">
                    <label for="c-description">About the Company</label>
                    <textarea id="c-description" rows="3"></textarea>
                </div>
                <button type="submit" class="btn" id="profileBtn">Save Profile</button>
            </form>
        </div>

        <!-- ===== Post / edit job ===== -->
        <h2 class="section-title" id="jobFormTitle">Post a Job</h2>
        <div class="card">
            <form id="jobForm" novalidate>
                <div class="form-row">
                    <div class="form-group">
                        <label for="j-title">Job Title</label>
                        <input type="text" id="j-title">
                        <div class="field-error" id="j-title-error"></div>
                    </div>
                    <div class="form-group">
                        <label for="j-location">Location</label>
                        <input type="text" id="j-location">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="j-package_lpa">Package (LPA, optional)</label>
                        <input type="number" id="j-package_lpa" step="0.01" min="0" max="999">
                        <div class="field-error" id="j-package_lpa-error"></div>
                    </div>
                    <div class="form-group">
                        <label for="j-min_cgpa">Minimum CGPA (0 to 10)</label>
                        <input type="number" id="j-min_cgpa" step="0.01" min="0" max="10" value="0">
                        <div class="field-error" id="j-min_cgpa-error"></div>
                    </div>
                </div>
                <div class="form-group">
                    <label>Allowed Departments</label>
                    <div id="deptBox"></div>
                    <div class="field-error" id="deptBox-error"></div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="j-deadline">Application Deadline</label>
                        <input type="date" id="j-deadline">
                        <div class="field-error" id="j-deadline-error"></div>
                    </div>
                    <div class="form-group">
                        <label for="j-status">Status</label>
                        <select id="j-status">
                            <option>Open</option>
                            <option>Closed</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label for="j-description">Description</label>
                    <textarea id="j-description" rows="3"></textarea>
                </div>
                <button type="submit" class="btn" id="jobBtn">Post Job</button>
                <button type="button" class="btn btn-light" id="cancelEditBtn"
                        style="display:none;border:1px solid var(--border);">Cancel Edit</button>
            </form>
        </div>

        <!-- ===== My jobs ===== -->
        <h2 class="section-title">My Jobs</h2>
        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>Title</th><th>Departments</th><th>Min CGPA</th><th>Package</th>
                        <th>Deadline</th><th>Status</th><th>Applicants</th><th>Actions</th>
                    </tr>
                </thead>
                <tbody id="jobsBody"><tr><td colspan="8">Loading...</td></tr></tbody>
            </table>
        </div>

        <!-- ===== Applicants (shown after clicking "Applicants") ===== -->
        <div id="applicantSection" style="display:none;">
            <h2 class="section-title" id="applicantTitle">Applicants</h2>
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>Name</th><th>Roll No</th><th>Dept</th><th>Year</th><th>CGPA</th>
                            <th>Eligibility</th><th>Status</th><th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="applicantBody"></tbody>
                </table>
            </div>
        </div>

        <!-- ===== Schedule interview (shown after clicking "Schedule") ===== -->
        <div id="scheduleSection" style="display:none;">
            <h2 class="section-title">Schedule Interview</h2>
            <div class="card">
                <p id="scheduleFor" style="margin-bottom:12px;"></p>
                <form id="scheduleForm" novalidate>
                    <input type="hidden" id="i-application_id">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="i-date">Start Date and Time</label>
                            <input type="datetime-local" id="i-date">
                            <div class="field-error" id="i-date-error"></div>
                        </div>
                        <div class="form-group">
                            <label for="i-mode">Mode</label>
                            <select id="i-mode">
                                <option>Online</option>
                                <option>Offline</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="i-duration">Duration</label>
                        <select id="i-duration">
                            <option value="30">30 minutes</option>
                            <option value="45">45 minutes</option>
                            <option value="60" selected>60 minutes</option>
                        </select>
                        <small id="i-endpreview" style="color:var(--muted);"></small>
                    </div>
                    <div class="form-group">
                        <label for="i-location">Meeting Link or Venue</label>
                        <input type="text" id="i-location" placeholder="https://meet... or Room 204, Main Block">
                        <div class="field-error" id="i-location-error"></div>
                    </div>
                    <button type="submit" class="btn" id="scheduleBtn">Schedule Interview</button>
                    <button type="button" class="btn btn-light" id="scheduleCancel"
                            style="border:1px solid var(--border);">Close</button>
                </form>
            </div>
        </div>

        <!-- ===== Interviews ===== -->
        <h2 class="section-title">Interviews</h2>
        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>Candidate</th><th>Job</th><th>Date and Time</th><th>Mode</th>
                        <th>Link / Venue</th><th>Status</th><th>Actions</th>
                    </tr>
                </thead>
                <tbody id="interviewBody"><tr><td colspan="7">Loading...</td></tr></tbody>
            </table>
        </div>
    </main>

    <script src="script.js"></script>
    <script>
        requireLogin("recruiter");

        const DEPARTMENTS = ["ALL", "CSE", "IT", "ECE", "EEE", "MECH", "CIVIL", "AIDS"];
        let myJobs = [];
        let applicants = [];
        let currentJob = null;
        let editingJobId = null;

        // ---------- Department checkboxes ----------
        document.getElementById("deptBox").innerHTML = DEPARTMENTS.map(function (d) {
            return '<label style="display:inline-block;font-weight:normal;margin-right:14px;">' +
                   '<input type="checkbox" class="dept" value="' + d + '" style="width:auto;"> ' + d + "</label>";
        }).join("");

        function setDepartments(text) {
            const chosen = text.split(",").map(function (d) { return d.trim(); });
            document.querySelectorAll(".dept").forEach(function (box) {
                box.checked = chosen.includes(box.value);
            });
        }
        function getDepartments() {
            const chosen = [];
            document.querySelectorAll(".dept").forEach(function (box) {
                if (box.checked) chosen.push(box.value);
            });
            return chosen.includes("ALL") ? "ALL" : chosen.join(",");
        }

        // ---------- Company profile ----------
        async function loadProfile() {
            try {
                const c = await apiRequest("/companies/profile");
                document.getElementById("c-company_name").value = c.company_name;
                document.getElementById("c-email").value = c.email;
                document.getElementById("c-phone").value = c.phone || "";
                document.getElementById("c-website").value = c.website || "";
                document.getElementById("c-description").value = c.description || "";
            } catch (error) {
                showMessage("pageMessage", error.message, "error");
            }
        }

        document.getElementById("profileForm").addEventListener("submit", async function (event) {
            event.preventDefault();
            hideMessage("pageMessage");

            const company_name = document.getElementById("c-company_name").value.trim();
            const phone = document.getElementById("c-phone").value.trim();
            const website = document.getElementById("c-website").value.trim();
            const description = document.getElementById("c-description").value.trim();

            let ok = true;
            ok = setFieldError("c-company_name", company_name.length < 2 ? "Enter the company name." : "") && ok;
            ok = setFieldError("c-phone", !PHONE_PATTERN.test(phone) ? "Enter a 10 digit phone number." : "") && ok;
            ok = setFieldError("c-website",
                (website !== "" && !/^https?:\/\/.+/.test(website)) ? "Website must start with http:// or https://" : "") && ok;
            if (!ok) return;

            const button = document.getElementById("profileBtn");
            button.disabled = true;
            try {
                await apiRequest("/companies/profile", {
                    method: "PUT",
                    body: JSON.stringify({ company_name: company_name, phone: phone, website: website, description: description })
                });
                localStorage.setItem("name", company_name);
                renderNavbar();
                showMessage("pageMessage", "Company profile saved.", "success");
            } catch (error) {
                showMessage("pageMessage", error.message, "error");
            } finally {
                button.disabled = false;
            }
        });

        // ---------- Post or edit a job ----------
        function resetJobForm() {
            editingJobId = null;
            document.getElementById("jobForm").reset();
            document.getElementById("j-min_cgpa").value = 0;
            setDepartments("");
            document.getElementById("jobFormTitle").textContent = "Post a Job";
            document.getElementById("jobBtn").textContent = "Post Job";
            document.getElementById("cancelEditBtn").style.display = "none";
        }

        document.getElementById("cancelEditBtn").addEventListener("click", resetJobForm);

        document.getElementById("jobForm").addEventListener("submit", async function (event) {
            event.preventDefault();
            hideMessage("pageMessage");

            const title = document.getElementById("j-title").value.trim();
            const location = document.getElementById("j-location").value.trim();
            const pkg = document.getElementById("j-package_lpa").value;
            const minCgpa = document.getElementById("j-min_cgpa").value;
            const departments = getDepartments();
            const deadline = document.getElementById("j-deadline").value;

            let ok = true;
            ok = setFieldError("j-title", title.length < 2 ? "Enter the job title." : "") && ok;
            ok = setFieldError("j-package_lpa",
                (pkg !== "" && (Number(pkg) < 0 || Number(pkg) > 999)) ? "Package must be 0 to 999." : "") && ok;
            ok = setFieldError("j-min_cgpa",
                (minCgpa === "" || Number(minCgpa) < 0 || Number(minCgpa) > 10) ? "Enter 0 to 10." : "") && ok;
            ok = setFieldError("deptBox", departments === "" ? "Choose at least one department." : "") && ok;
            if (!ok) return;

            const body = {
                title: title,
                description: document.getElementById("j-description").value.trim(),
                location: location,
                package_lpa: pkg === "" ? null : Number(pkg),
                min_cgpa: Number(minCgpa),
                allowed_departments: departments,
                deadline: deadline,
                status: document.getElementById("j-status").value
            };

            const button = document.getElementById("jobBtn");
            button.disabled = true;
            try {
                if (editingJobId) {
                    await apiRequest("/jobs/" + editingJobId, { method: "PUT", body: JSON.stringify(body) });
                    showMessage("pageMessage", "Job updated.", "success");
                } else {
                    await apiRequest("/jobs", { method: "POST", body: JSON.stringify(body) });
                    showMessage("pageMessage", "Job posted.", "success");
                }
                resetJobForm();
                loadJobs();
            } catch (error) {
                showMessage("pageMessage", error.message, "error");
            } finally {
                button.disabled = false;
            }
        });

        // ---------- My jobs table ----------
        const jobsBody = document.getElementById("jobsBody");

        async function loadJobs() {
            try {
                myJobs = await apiRequest("/jobs/mine");
                if (myJobs.length === 0) {
                    jobsBody.innerHTML = '<tr><td colspan="8">You have not posted any jobs yet.</td></tr>';
                    return;
                }
                jobsBody.innerHTML = myJobs.map(function (j) {
                    return "<tr>" +
                        "<td>" + escapeHtml(j.title) + "</td>" +
                        "<td>" + escapeHtml(j.allowed_departments) + "</td>" +
                        "<td>" + escapeHtml(j.min_cgpa) + "</td>" +
                        "<td>" + escapeHtml(j.package_lpa === null ? "-" : j.package_lpa + " LPA") + "</td>" +
                        "<td>" + escapeHtml(j.deadline || "-") + "</td>" +
                        "<td>" + statusBadge(j.status) + "</td>" +
                        "<td>" + escapeHtml(j.applicant_count) + "</td>" +
                        "<td>" +
                            '<button type="button" class="btn btn-small" data-act="applicants" data-id="' + j.id + '">Applicants</button> ' +
                            '<button type="button" class="btn btn-small btn-light" style="border:1px solid var(--border);" data-act="edit" data-id="' + j.id + '">Edit</button> ' +
                            '<button type="button" class="btn btn-small btn-danger" data-act="delete" data-id="' + j.id + '">Delete</button>' +
                        "</td></tr>";
                }).join("");
            } catch (error) {
                jobsBody.innerHTML = '<tr><td colspan="8">Could not load jobs.</td></tr>';
                showMessage("pageMessage", error.message, "error");
            }
        }

        jobsBody.addEventListener("click", async function (event) {
            const button = event.target.closest("button");
            if (!button) return;
            const id = Number(button.getAttribute("data-id"));
            const act = button.getAttribute("data-act");
            const job = myJobs.find(function (j) { return j.id === id; });
            hideMessage("pageMessage");

            if (act === "applicants") {
                currentJob = job;
                loadApplicants();
            }

            if (act === "edit") {
                editingJobId = id;
                document.getElementById("j-title").value = job.title;
                document.getElementById("j-location").value = job.location || "";
                document.getElementById("j-package_lpa").value = job.package_lpa === null ? "" : job.package_lpa;
                document.getElementById("j-min_cgpa").value = job.min_cgpa;
                document.getElementById("j-deadline").value = job.deadline || "";
                document.getElementById("j-status").value = job.status;
                document.getElementById("j-description").value = job.description || "";
                setDepartments(job.allowed_departments);
                document.getElementById("jobFormTitle").textContent = "Edit Job";
                document.getElementById("jobBtn").textContent = "Save Changes";
                document.getElementById("cancelEditBtn").style.display = "inline-block";
                document.getElementById("jobFormTitle").scrollIntoView({ behavior: "smooth" });
            }

            if (act === "delete") {
                if (!confirm("Delete this job? All its applications and interviews will also be deleted.")) return;
                try {
                    await apiRequest("/jobs/" + id, { method: "DELETE" });
                    showMessage("pageMessage", "Job deleted.", "success");
                    if (currentJob && currentJob.id === id) {
                        currentJob = null;
                        document.getElementById("applicantSection").style.display = "none";
                    }
                    loadJobs();
                    loadInterviews();
                } catch (error) {
                    showMessage("pageMessage", error.message, "error");
                }
            }
        });

        // ---------- Applicants ----------
        const applicantBody = document.getElementById("applicantBody");

        async function loadApplicants() {
            document.getElementById("applicantSection").style.display = "block";
            document.getElementById("applicantTitle").textContent = "Applicants for " + currentJob.title;
            applicantBody.innerHTML = '<tr><td colspan="8">Loading...</td></tr>';
            try {
                applicants = await apiRequest("/jobs/" + currentJob.id + "/applications");
                if (applicants.length === 0) {
                    applicantBody.innerHTML = '<tr><td colspan="8">No one has applied yet.</td></tr>';
                    return;
                }
                applicantBody.innerHTML = applicants.map(function (a) {
                    const eligibility = a.meets_criteria
                        ? '<span class="badge badge-selected">Meets criteria</span>'
                        : '<span class="badge badge-rejected">Below criteria</span><br><small>' +
                          escapeHtml(a.reasons.join(" ")) + "</small>";

                    let buttons = "";
                    if (a.resume_path) {
                        buttons += '<button type="button" class="btn btn-small btn-light" style="border:1px solid var(--border);" ' +
                                   'data-act="resume" data-id="' + a.id + '">Resume</button> ';
                    }
                    if (a.status === "Applied") {
                        buttons += '<button type="button" class="btn btn-small" data-act="status" data-status="Shortlisted" data-id="' + a.id + '">Shortlist</button> ' +
                                   '<button type="button" class="btn btn-small btn-danger" data-act="status" data-status="Rejected" data-id="' + a.id + '">Reject</button>';
                    } else if (a.status === "Shortlisted") {
                        buttons += '<button type="button" class="btn btn-small" data-act="schedule" data-id="' + a.id + '">Schedule</button> ' +
                                   '<button type="button" class="btn btn-small" data-act="status" data-status="Selected" data-id="' + a.id + '">Select</button> ' +
                                   '<button type="button" class="btn btn-small btn-danger" data-act="status" data-status="Rejected" data-id="' + a.id + '">Reject</button>';
                    }

                    return "<tr>" +
                        "<td>" + escapeHtml(a.name) + "</td>" +
                        "<td>" + escapeHtml(a.roll_no || "-") + "</td>" +
                        "<td>" + escapeHtml(a.department) + "</td>" +
                        "<td>" + escapeHtml(a.year) + "</td>" +
                        "<td>" + escapeHtml(a.cgpa) + "</td>" +
                        "<td>" + eligibility + "</td>" +
                        "<td>" + statusBadge(a.status) + "</td>" +
                        "<td>" + (buttons || "-") + "</td></tr>";
                }).join("");
            } catch (error) {
                applicantBody.innerHTML = '<tr><td colspan="8">Could not load applicants.</td></tr>';
                showMessage("pageMessage", error.message, "error");
            }
        }

        // Opens the PDF using the login token (a plain link cannot send the token)
        async function openResume(applicationId) {
            const win = window.open("", "_blank");   // opened first so the browser does not block it
            try {
                const response = await fetch(API_URL + "/resumes/application/" + applicationId, {
                    headers: { "Authorization": "Bearer " + getToken() }
                });
                if (!response.ok) {
                    let message = "Could not open the resume.";
                    try { message = (await response.json()).message; } catch (e) { /* no JSON */ }
                    throw new Error(message);
                }
                const blob = await response.blob();
                win.location = URL.createObjectURL(blob);
            } catch (error) {
                if (win) win.close();
                showMessage("pageMessage", error.message, "error");
            }
        }

        applicantBody.addEventListener("click", async function (event) {
            const button = event.target.closest("button");
            if (!button) return;
            const id = Number(button.getAttribute("data-id"));
            const act = button.getAttribute("data-act");
            hideMessage("pageMessage");

            if (act === "resume") {
                openResume(id);
            }

            if (act === "schedule") {
                const person = applicants.find(function (a) { return a.id === id; });
                document.getElementById("i-application_id").value = id;
                document.getElementById("scheduleFor").textContent =
                    "Candidate: " + person.name + " (" + (person.roll_no || "no roll no") + ") - " + currentJob.title;
                document.getElementById("scheduleSection").style.display = "block";
                document.getElementById("scheduleSection").scrollIntoView({ behavior: "smooth" });
            }

            if (act === "status") {
                const status = button.getAttribute("data-status");
                if (!confirm("Change this application to " + status + "?")) return;
                try {
                    const result = await apiRequest("/applications/" + id + "/status", {
                        method: "PUT",
                        body: JSON.stringify({ status: status })
                    });
                    showMessage("pageMessage", result.message, "success");
                    loadApplicants();
                } catch (error) {
                    showMessage("pageMessage", error.message, "error");
                }
            }
        });

        // ---------- Schedule an interview ----------
        document.getElementById("scheduleCancel").addEventListener("click", function () {
            document.getElementById("scheduleSection").style.display = "none";
        });

        // Shows the calculated end time under the Duration box
        function updateEndPreview() {
            const value = document.getElementById("i-date").value;
            const box = document.getElementById("i-endpreview");
            if (!value) { box.textContent = ""; return; }
            const minutes = Number(document.getElementById("i-duration").value);
            const end = new Date(new Date(value).getTime() + minutes * 60000);
            box.textContent = "Ends at " + end.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
        }
        document.getElementById("i-date").addEventListener("input", updateEndPreview);
        document.getElementById("i-duration").addEventListener("change", updateEndPreview);

        document.getElementById("scheduleForm").addEventListener("submit", async function (event) {
            event.preventDefault();
            hideMessage("pageMessage");

            const date = document.getElementById("i-date").value;
            const mode = document.getElementById("i-mode").value;
            const place = document.getElementById("i-location").value.trim();

            let ok = true;
            ok = setFieldError("i-date",
                (date === "" || new Date(date) <= new Date()) ? "Choose a date and time in the future." : "") && ok;
            ok = setFieldError("i-location", place === "" ? "Enter the link or venue." : "") && ok;
            if (!ok) return;

            const button = document.getElementById("scheduleBtn");
            button.disabled = true;
            try {
                await apiRequest("/interviews", {
                    method: "POST",
                    body: JSON.stringify({
                        application_id: Number(document.getElementById("i-application_id").value),
                        interview_date: date,
                        duration_minutes: Number(document.getElementById("i-duration").value),
                        mode: mode,
                        location_or_link: place
                    })
                });
                document.getElementById("scheduleForm").reset();
                document.getElementById("i-endpreview").textContent = "";
                document.getElementById("scheduleSection").style.display = "none";
                showMessage("pageMessage", "Interview scheduled. The student has been notified.", "success");
                loadInterviews();
            } catch (error) {
                showMessage("pageMessage", error.message, "error");
            } finally {
                button.disabled = false;
            }
        });

        // ---------- Interviews table ----------
        const interviewBody = document.getElementById("interviewBody");

        async function loadInterviews() {
            try {
                const list = await apiRequest("/interviews/company");
                if (list.length === 0) {
                    interviewBody.innerHTML = '<tr><td colspan="7">No interviews scheduled yet.</td></tr>';
                    return;
                }
                interviewBody.innerHTML = list.map(function (i) {
                    const buttons = i.status === "Scheduled"
                        ? '<button type="button" class="btn btn-small" data-status="Completed" data-id="' + i.id + '">Completed</button> ' +
                          '<button type="button" class="btn btn-small btn-danger" data-status="Cancelled" data-id="' + i.id + '">Cancel</button>'
                        : "-";
                    return "<tr>" +
                        "<td>" + escapeHtml(i.student_name) + " (" + escapeHtml(i.roll_no || "-") + ")</td>" +
                        "<td>" + escapeHtml(i.title) + "</td>" +
                        "<td>" + interviewTimes(i) + "</td>" +
                        "<td>" + escapeHtml(i.mode) + "</td>" +
                        "<td>" + escapeHtml(i.location_or_link) + "</td>" +
                        "<td>" + statusBadge(i.status) + "</td>" +
                        "<td>" + buttons + "</td></tr>";
                }).join("");
            } catch (error) {
                interviewBody.innerHTML = '<tr><td colspan="7">Could not load interviews.</td></tr>';
                showMessage("pageMessage", error.message, "error");
            }
        }

        interviewBody.addEventListener("click", async function (event) {
            const button = event.target.closest("button");
            if (!button) return;
            const status = button.getAttribute("data-status");
            if (!confirm("Mark this interview as " + status + "?")) return;

            hideMessage("pageMessage");
            try {
                const result = await apiRequest("/interviews/" + button.getAttribute("data-id") + "/status", {
                    method: "PUT",
                    body: JSON.stringify({ status: status })
                });
                showMessage("pageMessage", result.message, "success");
                loadInterviews();
            } catch (error) {
                showMessage("pageMessage", error.message, "error");
            }
        });

        // ---------- Start ----------
        loadProfile();
        loadJobs();
        loadInterviews();
    </script>

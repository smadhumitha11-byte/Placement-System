<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Placement Cell Portal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav id="navbar"></nav>

    <main class="container">
        <div class="card form-card">
            <h2>Create an Account</h2>
            <p class="subtitle">Register as a student or as a company recruiter.</p>

            <div class="tabs">
                <button type="button" class="tab-btn active" id="studentTab">Student</button>
                <button type="button" class="tab-btn" id="companyTab">Company</button>
            </div>

            <div id="message" class="alert"></div>

            <!-- ===== STUDENT FORM ===== -->
            <form id="studentForm" novalidate>
                <div class="form-group">
                    <label for="s-name">Full Name</label>
                    <input type="text" id="s-name">
                    <div class="field-error" id="s-name-error"></div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="s-roll_no">Roll Number</label>
                        <input type="text" id="s-roll_no">
                        <div class="field-error" id="s-roll_no-error"></div>
                    </div>
                    <div class="form-group">
                        <label for="s-phone">Phone (10 digits)</label>
                        <input type="text" id="s-phone" maxlength="10">
                        <div class="field-error" id="s-phone-error"></div>
                    </div>
                </div>

                <div class="form-group">
                    <label for="s-email">Email</label>
                    <input type="email" id="s-email">
                    <div class="field-error" id="s-email-error"></div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="s-department">Department</label>
                        <select id="s-department">
                            <option value="">Select</option>
                            <option>CSE</option>
                            <option>IT</option>
                            <option>ECE</option>
                            <option>EEE</option>
                            <option>MECH</option>
                            <option>CIVIL</option>
                            <option>AIDS</option>
                        </select>
                        <div class="field-error" id="s-department-error"></div>
                    </div>
                    <div class="form-group">
                        <label for="s-year">Year</label>
                        <select id="s-year">
                            <option value="">Select</option>
                            <option value="1">1</option>
                            <option value="2">2</option>
                            <option value="3">3</option>
                            <option value="4">4</option>
                        </select>
                        <div class="field-error" id="s-year-error"></div>
                    </div>
                </div>

                <div class="form-group">
                    <label for="s-cgpa">CGPA (0 to 10)</label>
                    <input type="number" id="s-cgpa" step="0.01" min="0" max="10">
                    <div class="field-error" id="s-cgpa-error"></div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="s-password">Password (min 8 characters)</label>
                        <input type="password" id="s-password" autocomplete="new-password">
                        <div class="field-error" id="s-password-error"></div>
                    </div>
                    <div class="form-group">
                        <label for="s-confirm">Confirm Password</label>
                        <input type="password" id="s-confirm" autocomplete="new-password">
                        <div class="field-error" id="s-confirm-error"></div>
                    </div>
                </div>

                <button type="submit" class="btn btn-block" id="studentBtn">Register as Student</button>
            </form>

            <!-- ===== COMPANY FORM ===== -->
            <form id="companyForm" novalidate style="display:none;">
                <div class="form-group">
                    <label for="c-company_name">Company Name</label>
                    <input type="text" id="c-company_name">
                    <div class="field-error" id="c-company_name-error"></div>
                </div>

                <div class="form-group">
                    <label for="c-email">Recruiter Email (used to login)</label>
                    <input type="email" id="c-email">
                    <div class="field-error" id="c-email-error"></div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="c-phone">Phone (10 digits)</label>
                        <input type="text" id="c-phone" maxlength="10">
                        <div class="field-error" id="c-phone-error"></div>
                    </div>
                    <div class="form-group">
                        <label for="c-website">Website (optional)</label>
                        <input type="text" id="c-website" placeholder="https://example.com">
                        <div class="field-error" id="c-website-error"></div>
                    </div>
                </div>

                <div class="form-group">
                    <label for="c-description">About the Company (optional)</label>
                    <textarea id="c-description" rows="3"></textarea>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="c-password">Password (min 8 characters)</label>
                        <input type="password" id="c-password" autocomplete="new-password">
                        <div class="field-error" id="c-password-error"></div>
                    </div>
                    <div class="form-group">
                        <label for="c-confirm">Confirm Password</label>
                        <input type="password" id="c-confirm" autocomplete="new-password">
                        <div class="field-error" id="c-confirm-error"></div>
                    </div>
                </div>

                <button type="submit" class="btn btn-block" id="companyBtn">Register Company</button>
            </form>

            <p class="form-footer">Already registered? <a href="login.html">Login</a></p>
        </div>
    </main>

    <script src="script.js"></script>
    <script>
        const studentForm = document.getElementById("studentForm");
        const companyForm = document.getElementById("companyForm");
        const studentTab = document.getElementById("studentTab");
        const companyTab = document.getElementById("companyTab");

        // ----- Switch between the two forms -----
        function showForm(which) {
            hideMessage("message");
            studentForm.style.display = which === "student" ? "block" : "none";
            companyForm.style.display = which === "company" ? "block" : "none";
            studentTab.classList.toggle("active", which === "student");
            companyTab.classList.toggle("active", which === "company");
        }
        studentTab.addEventListener("click", function () { showForm("student"); });
        companyTab.addEventListener("click", function () { showForm("company"); });

        // ----- Student registration -----
        studentForm.addEventListener("submit", async function (event) {
            event.preventDefault();
            hideMessage("message");

            const name = document.getElementById("s-name").value.trim();
            const roll_no = document.getElementById("s-roll_no").value.trim();
            const phone = document.getElementById("s-phone").value.trim();
            const email = document.getElementById("s-email").value.trim();
            const department = document.getElementById("s-department").value;
            const year = document.getElementById("s-year").value;
            const cgpa = document.getElementById("s-cgpa").value;
            const password = document.getElementById("s-password").value;
            const confirm = document.getElementById("s-confirm").value;

            // Each check returns true when the field is fine
            let ok = true;
            ok = setFieldError("s-name", name.length < 2 ? "Enter your full name." : "") && ok;
            ok = setFieldError("s-roll_no", roll_no === "" ? "Roll number is required." : "") && ok;
            ok = setFieldError("s-phone", !PHONE_PATTERN.test(phone) ? "Enter a 10 digit phone number." : "") && ok;
            ok = setFieldError("s-email", !EMAIL_PATTERN.test(email) ? "Enter a valid email." : "") && ok;
            ok = setFieldError("s-department", department === "" ? "Select a department." : "") && ok;
            ok = setFieldError("s-year", year === "" ? "Select your year." : "") && ok;
            ok = setFieldError("s-cgpa",
                (cgpa === "" || Number(cgpa) < 0 || Number(cgpa) > 10) ? "CGPA must be between 0 and 10." : "") && ok;
            ok = setFieldError("s-password", password.length < 8 ? "At least 8 characters." : "") && ok;
            ok = setFieldError("s-confirm", confirm !== password ? "Passwords do not match." : "") && ok;
            if (!ok) return;

            const button = document.getElementById("studentBtn");
            button.disabled = true;
            button.textContent = "Registering...";

            try {
                await apiRequest("/students/register", {
                    method: "POST",
                    body: JSON.stringify({
                        name: name,
                        roll_no: roll_no,
                        email: email,
                        phone: phone,
                        department: department,
                        year: Number(year),
                        cgpa: Number(cgpa),
                        password: password
                    })
                });
                studentForm.reset();
                showMessage("message", "Registration successful! You can now login.", "success");
            } catch (error) {
                showMessage("message", error.message, "error");
            } finally {
                button.disabled = false;
                button.textContent = "Register as Student";
            }
        });

        // ----- Company registration -----
        companyForm.addEventListener("submit", async function (event) {
            event.preventDefault();
            hideMessage("message");

            const company_name = document.getElementById("c-company_name").value.trim();
            const email = document.getElementById("c-email").value.trim();
            const phone = document.getElementById("c-phone").value.trim();
            const website = document.getElementById("c-website").value.trim();
            const description = document.getElementById("c-description").value.trim();
            const password = document.getElementById("c-password").value;
            const confirm = document.getElementById("c-confirm").value;

            let ok = true;
            ok = setFieldError("c-company_name", company_name.length < 2 ? "Enter the company name." : "") && ok;
            ok = setFieldError("c-email", !EMAIL_PATTERN.test(email) ? "Enter a valid email." : "") && ok;
            ok = setFieldError("c-phone", !PHONE_PATTERN.test(phone) ? "Enter a 10 digit phone number." : "") && ok;
            ok = setFieldError("c-website",
                (website !== "" && !/^https?:\/\/.+/.test(website)) ? "Website must start with http:// or https://" : "") && ok;
            ok = setFieldError("c-password", password.length < 8 ? "At least 8 characters." : "") && ok;
            ok = setFieldError("c-confirm", confirm !== password ? "Passwords do not match." : "") && ok;
            if (!ok) return;

            const button = document.getElementById("companyBtn");
            button.disabled = true;
            button.textContent = "Registering...";

            try {
                await apiRequest("/companies/register", {
                    method: "POST",
                    body: JSON.stringify({
                        company_name: company_name,
                        email: email,
                        phone: phone,
                        website: website,
                        description: description,
                        password: password
                    })
                });
                companyForm.reset();
                showMessage("message", "Company registered! You can now login.", "success");
            } catch (error) {
                showMessage("message", error.message, "error");
            } finally {
                button.disabled = false;
                button.textContent = "Register Company";
            }
        });
    </script>
</body>
</html>

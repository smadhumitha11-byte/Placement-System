<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration - Placement Cell</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 30px;
        }

        .container {
            width: 520px;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 5px;
            color: #1f3c88;
        }

        h2 {
            text-align: center;
            margin-bottom: 5px;
            color: #333;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 17px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #333;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
            background: white;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #1f3c88;
            box-shadow: 0 0 4px rgba(31, 60, 136, 0.25);
        }

        .password-box {
            display: flex;
            gap: 8px;
        }

        .password-box input {
            flex: 1;
        }

        .password-box button {
            width: 65px;
            border: none;
            border-radius: 7px;
            background: #e9edf5;
            cursor: pointer;
        }

        .password-box button:hover {
            background: #d6dce8;
        }

        .register-btn {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 7px;
            background: #1f3c88;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
        }

        .register-btn:hover:not(:disabled) {
            background: #162f6b;
        }

        .register-btn:disabled {
            background: #8a99bd;
            cursor: not-allowed;
        }

        #message {
            text-align: center;
            margin-top: 18px;
            font-weight: bold;
            min-height: 20px;
        }

        .success {
            color: green;
        }

        .error {
            color: red;
        }

        .login-text {
            text-align: center;
            margin-top: 20px;
        }

        .login-text a {
            color: #1f3c88;
            text-decoration: none;
            font-weight: bold;
        }

        @media (max-width: 600px) {
            .container {
                width: 100%;
                padding: 25px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Placement Cell</h1>

    <h2>Student Registration</h2>

    <p class="subtitle">Create your student account</p>

    <form id="registerForm" novalidate>

        <div class="form-group">
            <label for="name">Full Name</label>
            <input
                type="text"
                id="name"
                placeholder="Enter your full name"
                required>
        </div>

        <div class="form-group">
            <label for="rollNo">Roll Number</label>
            <input
                type="text"
                id="rollNo"
                placeholder="Enter your roll number"
                required>
        </div>

        <div class="form-group">
            <label for="email">Email</label>
            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required>
        </div>

        <div class="form-group">
            <label for="password">Password</label>

            <div class="password-box">

                <input
                    type="password"
                    id="password"
                    placeholder="Min 8 chars, upper/lower/digit"
                    minlength="8"
                    required>

                <button
                    type="button"
                    id="showPassword"
                    aria-label="Toggle password visibility">
                    Show
                </button>

            </div>
        </div>

        <div class="form-group">
            <label for="confirmPassword">Confirm Password</label>
            <input
                type="password"
                id="confirmPassword"
                placeholder="Re-enter your password"
                minlength="8"
                required>
        </div>

        <div class="form-group">
            <label for="department">Department</label>

            <select id="department" required>

                <option value="">Select Department</option>

                <option value="CSE">Computer Science and Engineering</option>
                <option value="IT">Information Technology</option>
                <option value="ECE">Electronics and Communication Engineering</option>
                <option value="EEE">Electrical and Electronics Engineering</option>
                <option value="MECH">Mechanical Engineering</option>
                <option value="CIVIL">Civil Engineering</option>
                <option value="AERO">Aeronautical Engineering</option>
                <option value="AIML">Artificial Intelligence and Machine Learning</option>
                <option value="AIDS">Artificial Intelligence and Data Science</option>
                <option value="CSBS">Computer Science and Business Systems</option>
                <option value="BIOTECH">Biotechnology</option>
                <option value="CHEMICAL">Chemical Engineering</option>
                <option value="OTHER">Other</option>

            </select>
        </div>

        <div class="form-group">
            <label for="cgpa">CGPA</label>

            <input
                type="number"
                id="cgpa"
                placeholder="Enter CGPA (0 - 10)"
                min="0"
                max="10"
                step="0.01"
                required>
        </div>

        <div class="form-group">
            <label for="phone">Phone Number</label>

            <input
                type="tel"
                id="phone"
                placeholder="Enter 10-digit phone number"
                maxlength="10"
                required>
        </div>

        <button type="submit" class="register-btn" id="registerBtn">
            Register
        </button>

    </form>

    <p id="message" role="status" aria-live="polite"></p>

    <p class="login-text">
        Already have an account?
        <a href="index.html">Login</a>
    </p>

</div>

<script>

// ---- Config ----
const API_BASE = "http://localhost:3000"; // change this in production
const API_REGISTER = `${API_BASE}/api/students/register`;

// ---- Elements ----
const form            = document.getElementById("registerForm");
const message         = document.getElementById("message");
const password        = document.getElementById("password");
const confirmPassword = document.getElementById("confirmPassword");
const showPassword    = document.getElementById("showPassword");
const registerBtn     = document.getElementById("registerBtn");

// ---- Helpers ----
function showMessage(text, type) {
    message.textContent = text;
    message.className = type || "";
}

function isValidEmail(email) {
    return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
}

function isStrongPassword(pw) {
    // at least 8 chars, one lowercase, one uppercase, one digit
    return /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d).{8,}$/.test(pw);
}

// ---- Show/Hide Password ----
showPassword.addEventListener("click", function () {
    if (password.type === "password") {
        password.type = "text";
        showPassword.textContent = "Hide";
    } else {
        password.type = "password";
        showPassword.textContent = "Show";
    }
});

// ---- Submit ----
form.addEventListener("submit", async function (event) {
    event.preventDefault();

    // ---- Collect values ----
    const name        = document.getElementById("name").value.trim();
    const rollNo      = document.getElementById("rollNo").value.trim();
    const email       = document.getElementById("email").value.trim();
    const department  = document.getElementById("department").value;
    const cgpaRaw     = document.getElementById("cgpa").value;
    const phone       = document.getElementById("phone").value.trim();
    const cgpa        = parseFloat(cgpaRaw);

    // ---- Validate: name ----
    if (!name) {
        showMessage("Please enter your full name.", "error");
        return;
    }

    // ---- Validate: roll number ----
    if (!rollNo) {
        showMessage("Please enter your roll number.", "error");
        return;
    }

    // ---- Validate: email ----
    if (!isValidEmail(email)) {
        showMessage("Please enter a valid email address.", "error");
        return;
    }

    // ---- Validate: password ----
    if (!isStrongPassword(password.value)) {
        showMessage(
            "Password must be 8+ characters and include uppercase, lowercase, and a number.",
            "error"
        );
        return;
    }

    // ---- Validate: confirm password ----
    if (password.value !== confirmPassword.value) {
        showMessage("Passwords do not match.", "error");
        return;
    }

    // ---- Validate: department ----
    if (!department) {
        showMessage("Please select a department.", "error");
        return;
    }

    // ---- Validate: CGPA ----
    if (isNaN(cgpa) || cgpa < 0 || cgpa > 10) {
        showMessage("CGPA must be a number between 0 and 10.", "error");
        return;
    }

    // ---- Validate: phone ----
    if (!/^[0-9]{10}$/.test(phone)) {
        showMessage("Please enter a valid 10-digit phone number.", "error");
        return;
    }

    // ---- Build payload ----
    const student = {
        name,
        rollNo,
        email,
        password: password.value,
        department,
        cgpa,
        phone
    };

    // ---- Disable button to prevent double submit ----
    registerBtn.disabled = true;
    const originalBtnText = registerBtn.textContent;
    registerBtn.textContent = "Registering...";
    showMessage("Registering...", "");

    try {
        const response = await fetch(API_REGISTER, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(student)
        });

        // Handle non-JSON responses gracefully
        let data;
        try {
            data = await response.json();
        } catch (parseErr) {
            data = { message: "Unexpected server response." };
        }

        if (response.ok) {
            showMessage(data.message || "Registration successful!", "success");
            form.reset();
        } else {
            const baseMsg = data.message || "Registration failed.";
            const extra   = data.error ? ": " + data.error : "";
            showMessage(baseMsg + extra, "error");
        }
    } catch (error) {
        showMessage("Unable to connect to the server.", "error");
    } finally {
        registerBtn.disabled = false;
        registerBtn.textContent = originalBtnText;
    }
});

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Applications - Placement Cell Portal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav id="navbar"></nav>

    <main class="container">
        <h2 class="section-title" style="margin-top:0;">My Applications</h2>
        <div id="pageMessage" class="alert"></div>

        <div class="form-group" style="max-width:260px;">
            <label for="statusFilter">Filter by status</label>
            <select id="statusFilter">
                <option value="">All</option>
                <option>Applied</option>
                <option>Shortlisted</option>
                <option>Selected</option>
                <option>Rejected</option>
                <option>Withdrawn</option>
            </select>
        </div>

        <div id="appList"><p>Loading...</p></div>
    </main>

    <script src="script.js"></script>
    <script>
        requireLogin("student");

        let allApplications = [];
        let allInterviews = [];
        const appList = document.getElementById("appList");

        // Works out the four steps of the tracker for one application
        function buildSteps(a) {
            const mine = allInterviews.filter(function (i) { return i.application_id === a.id; });
            const last = mine.length ? mine[mine.length - 1] : null;

            const labels = ["Applied", "Shortlisted", "Interview", "Selected"];
            const notes = [String(a.applied_at).slice(0, 10), "", "", ""];
            let state = ["done", "pending", "pending", "pending"];

            if (a.status === "Shortlisted" || a.status === "Selected" || (a.status === "Rejected" && last)) {
                state[1] = "done";
            }
            if (last) {
                notes[2] = String(last.interview_date).slice(0, 16) + " (" + last.status + ")";
                if (last.status === "Completed") state[2] = "done";
                if (last.status === "Scheduled") state[2] = "current";
            }

            if (a.status === "Selected") {
                state = ["done", "done", "done", "done"];
            } else if (a.status === "Rejected") {
                const failAt = last ? 3 : 1;
                state[failAt] = "fail";
                labels[failAt] = "Rejected";
            } else if (a.status === "Withdrawn") {
                state[1] = "fail";
                labels[1] = "Withdrawn";
            } else {
                // Applied or Shortlisted: the next waiting step is the current one
                const next = state.indexOf("pending");
                if (next !== -1) state[next] = "current";
            }

            return labels.map(function (label, i) {
                return { label: label, note: notes[i], state: state[i] };
            });
        }

        function draw() {
            const filter = document.getElementById("statusFilter").value;
            const rows = allApplications.filter(function (a) {
                return filter === "" || a.status === filter;
            });

            if (rows.length === 0) {
                appList.innerHTML = "<p>No applications found.</p>";
                return;
            }

            appList.innerHTML = rows.map(function (a) {
                const canWithdraw = a.status === "Applied" || a.status === "Shortlisted";
                const steps = buildSteps(a).map(function (s) {
                    return '<li class="' + s.state + '">' + escapeHtml(s.label) +
                           (s.note ? "<br><small>" + escapeHtml(s.note) + "</small>" : "") + "</li>";
                }).join("");

                return '<div class="card" style="margin-bottom:16px;">' +
                    '<div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;">' +
                        "<div><h3>" + escapeHtml(a.title) + "</h3>" +
                        "<p><strong>" + escapeHtml(a.company_name) + "</strong> &middot; " +
                        escapeHtml(a.package_lpa === null ? "Package not stated" : a.package_lpa + " LPA") + "</p></div>" +
                        "<div>" + statusBadge(a.status) + (canWithdraw
                            ? ' <button type="button" class="btn btn-small btn-danger" data-id="' + a.id + '">Withdraw</button>'
                            : "") + "</div>" +
                    "</div>" +
                    '<ol class="tracker">' + steps + "</ol></div>";
            }).join("");
        }

        async function loadAll() {
            try {
                allApplications = await apiRequest("/applications/my");
                allInterviews = await apiRequest("/interviews/my");
                draw();
            } catch (error) {
                appList.innerHTML = "";
                showMessage("pageMessage", error.message, "error");
            }
        }

        document.getElementById("statusFilter").addEventListener("change", draw);

        appList.addEventListener("click", async function (event) {
            const button = event.target.closest("button[data-id]");
            if (!button) return;
            if (!confirm("Withdraw this application? This cannot be undone.")) return;

            hideMessage("pageMessage");
            try {
                await apiRequest("/applications/" + button.getAttribute("data-id") + "/withdraw", { method: "PUT" });
                showMessage("pageMessage", "Application withdrawn.", "success");
                loadAll();
            } catch (error) {
                showMessage("pageMessage", error.message, "error");
            }
        });

        loadAll();
    </script>
</body>
</html>

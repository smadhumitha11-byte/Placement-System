<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Applications - Placement Cell Portal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav id="navbar"></nav>

    <main class="container">
        <h2 class="section-title" style="margin-top:0;">My Applications</h2>
        <div id="pageMessage" class="alert"></div>

        <div class="form-group" style="max-width:260px;">
            <label for="statusFilter">Filter by status</label>
            <select id="statusFilter">
                <option value="">All</option>
                <option>Applied</option>
                <option>Shortlisted</option>
                <option>Selected</option>
                <option>Rejected</option>
                <option>Withdrawn</option>
            </select>
        </div>

        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>Job</th>
                        <th>Company</th>
                        <th>Package</th>
                        <th>Applied On</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <tr><td colspan="6">Loading...</td></tr>
                </tbody>
            </table>
        </div>
    </main>

    <script src="script.js"></script>
    <script>
        requireLogin("student");

        let allApplications = [];
        const tableBody = document.getElementById("tableBody");

        function draw() {
            const filter = document.getElementById("statusFilter").value;
            const rows = allApplications.filter(function (a) {
                return filter === "" || a.status === filter;
            });

            if (rows.length === 0) {
                tableBody.innerHTML = '<tr><td colspan="6">No applications found.</td></tr>';
                return;
            }

            tableBody.innerHTML = rows.map(function (a) {
                const canWithdraw = a.status === "Applied" || a.status === "Shortlisted";
                return "<tr>" +
                    "<td>" + escapeHtml(a.title) + "</td>" +
                    "<td>" + escapeHtml(a.company_name) + "</td>" +
                    "<td>" + escapeHtml(a.package_lpa === null ? "-" : a.package_lpa + " LPA") + "</td>" +
                    "<td>" + escapeHtml(String(a.applied_at).slice(0, 10)) + "</td>" +
                    "<td>" + statusBadge(a.status) + "</td>" +
                    "<td>" + (canWithdraw
                        ? '<button type="button" class="btn btn-small btn-danger" data-id="' + a.id + '">Withdraw</button>'
                        : "-") + "</td>" +
                    "</tr>";
            }).join("");
        }

        async function loadApplications() {
            try {
                allApplications = await apiRequest("/applications/my");
                draw();
            } catch (error) {
                tableBody.innerHTML = '<tr><td colspan="6">Could not load applications.</td></tr>';
                showMessage("pageMessage", error.message, "error");
            }
        }

        document.getElementById("statusFilter").addEventListener("change", draw);

        tableBody.addEventListener("click", async function (event) {
            const button = event.target.closest("button");
            if (!button) return;
            if (!confirm("Withdraw this application? This cannot be undone.")) return;

            hideMessage("pageMessage");
            try {
                await apiRequest("/applications/" + button.getAttribute("data-id") + "/withdraw", { method: "PUT" });
                showMessage("pageMessage", "Application withdrawn.", "success");
                loadApplications();
            } catch (error) {
                showMessage("pageMessage", error.message, "error");
            }
        });

        loadApplications();
    </script>
</body>
</html>
